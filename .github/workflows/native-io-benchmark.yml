name: Native IO Benchmark

on:
  workflow_dispatch:
    inputs:
      backend:
        description: Native backend to benchmark
        required: false
        default: all
      benchmark_pattern:
        description: JMH benchmark regex to run
        required: false
        default: NativeIOBenchmark
      file_size_mb:
        description: Benchmark file size in MiB
        required: false
        default: '64'
      read_size:
        description: NativeIO pread chunk size in bytes
        required: false
        default: '131072'
      warmup_iterations:
        description: JMH warmup iterations
        required: false
        default: '1'
      measurement_iterations:
        description: JMH measurement iterations
        required: false
        default: '2'
      forks:
        description: JMH fork count
        required: false
        default: '1'

permissions:
  contents: read

jobs:
  native-io-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        backend: [c, rust]
    if: ${{ inputs.backend == 'all' || inputs.backend == matrix.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository/*/*/*
            !~/.m2/repository/org/apache/bookkeeper
            !~/.m2/repository/org/apache/distributedlog
          key: ${{ runner.os }}-bookkeeper-all-${{ hashFiles('**/pom.xml') }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Rust
        if: matrix.backend == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Build microbenchmarks
        run: |
          backend_profile=
          if [ "${{ matrix.backend }}" = "rust" ]; then
            backend_profile="-Pnative-rust"
          fi
          mvn -B -nsu -pl microbenchmarks -am package \
            ${backend_profile} \
            -DskipTests \
            -Dcheckstyle.skip \
            -Dspotbugs.skip \
            -Drat.skip \
            -Dmaven.javadoc.skip

      - name: Resolve native library path
        run: |
          library_path="$GITHUB_WORKSPACE/native-io/target/classes/lib/libnative-io.so"
          if [ "${{ matrix.backend }}" = "rust" ]; then
            library_path="$GITHUB_WORKSPACE/native-io/target/classes/lib/rust/libnative-io.so"
          fi
          echo "BOOKKEEPER_NATIVE_IO_LIBRARY_PATH=$library_path" >> "$GITHUB_ENV"
          echo "BOOKKEEPER_NATIVE_IO_IMPL=${{ matrix.backend }}" >> "$GITHUB_ENV"
          ls -l "$GITHUB_WORKSPACE/native-io/target/classes/lib" || true
          test -f "$library_path"

      - name: Run native-io benchmark
        run: |
          mkdir -p benchmark-results
          java -Xms1G -Xmx1G \
            -Djdk.nio.maxCachedBufferSize=0 \
            -Djava.net.preferIPv4Stack=true \
            --add-opens java.base/java.util.zip=ALL-UNNAMED \
            -XX:-MaxFDLimit \
            -XX:+UseG1GC \
            -XX:MaxGCPauseMillis=200 \
            -XX:+ResizeTLAB \
            -XX:-ResizePLAB \
            -XX:MetaspaceSize=128m \
            -XX:MinMetaspaceFreeRatio=50 \
            -XX:MaxMetaspaceFreeRatio=80 \
            -XX:+ParallelRefProcEnabled \
            -XX:StackShadowPages=20 \
            -XX:+UseCompressedOops \
            -XX:+DisableExplicitGC \
            -XX:StringTableSize=1000003 \
            -XX:InitiatingHeapOccupancyPercent=40 \
            -jar microbenchmarks/target/benchmarks.jar "${{ inputs.benchmark_pattern }}" \
            -f "${{ inputs.forks }}" \
            -wi "${{ inputs.warmup_iterations }}" \
            -i "${{ inputs.measurement_iterations }}" \
            -p advice=NONE,SEQUENTIAL,RANDOM,WILLNEED \
            -p fileSizeMb="${{ inputs.file_size_mb }}" \
            -p readSize="${{ inputs.read_size }}" \
            -rf json \
            -rff benchmark-results/native-io-benchmark-${{ matrix.backend }}.json | tee benchmark-results/native-io-benchmark-${{ matrix.backend }}.txt

      - name: Write benchmark summary
        if: always()
        run: |
          echo "## Native IO benchmark" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend: \`${{ matrix.backend }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pattern: \`${{ inputs.benchmark_pattern }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- fileSizeMb: \`${{ inputs.file_size_mb }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- readSize: \`${{ inputs.read_size }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- library: \`${BOOKKEEPER_NATIVE_IO_LIBRARY_PATH}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f benchmark-results/native-io-benchmark-${{ matrix.backend }}.txt ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 40 benchmark-results/native-io-benchmark-${{ matrix.backend }}.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-io-benchmark-results-${{ matrix.backend }}
          path: benchmark-results
